name: Altus + Windows installer

on:
  push:
    branches:
      - master
      - release/altus-plus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install pinned dependencies
        run: yarn install --immutable
      - name: Typecheck and lint
        run: yarn lint
      - name: IPC security tests
        run: yarn test
      - name: Package Windows installer
        run: yarn make -p win32
      # A build that fails the smoke test is never uploaded, so never released.
      - name: Smoke test (app, installer, migration, uninstall)
        run: yarn smoke --installer
      - name: Enter keys (new line, Ctrl+Enter, Right Shift+Enter)
        run: yarn test:keys
      - name: Smoke test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Downloadable Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Altus-Plus-Windows
          path: |
            out/make/**/*.exe
            out/make/**/*.blockmap
            out/make/**/latest.yml
          if-no-files-found: error
          retention-days: 90
