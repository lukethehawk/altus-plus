name: Security audit

# Weekly check of the dependency graph against the npm advisory database.
# A failed run (GitHub emails the repository owner) means something new needs
# triage; known advisories are listed in .yarnrc.yml and explained in
# docs/DEPENDENCY-AUDIT-ELECTRON44.md.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - name: App dependencies (new high or critical advisories)
        run: yarn npm audit --all --recursive --environment production --severity high
      - name: Electron runtime (any advisory)
        if: ${{ !cancelled() }}
        run: |
          yarn npm audit --all --recursive --severity low --json > electron-audit.jsonl || true
          node .github/scripts/check-electron-advisories.mjs < electron-audit.jsonl
      - name: Full report (informational)
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Full dependency audit (all environments, moderate and above)'
            echo
            echo 'Build tooling included; see docs/DEPENDENCY-AUDIT-ELECTRON44.md for what ships in the app.'
            echo
            echo '```'
            yarn npm audit --all --recursive --severity moderate || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
