name: Stability checks

on:
  pull_request:
  push:
    branches:
      - hardening/stability-security-first

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck and lint
        run: yarn lint
      - name: Dependency vulnerability audit (informational)
        run: yarn npm audit --all --recursive --severity high
        continue-on-error: true
      - name: Test IPC security helpers
        run: yarn test

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Windows installer
        run: yarn make -p win32
      - name: Smoke test (app, installer, migration, uninstall)
        run: yarn smoke --installer
      - name: Enter keys (new line, Ctrl+Enter, Right Shift+Enter)
        if: ${{ !cancelled() }}
        run: yarn test:keys
      - name: Smoke test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 14
