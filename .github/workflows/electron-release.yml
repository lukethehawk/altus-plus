name: Electron updates

# Weekly check (Monday morning, like the Security audit) for newer releases
# of the pinned Electron major line, which carry Chromium security fixes that
# usually get no npm advisory, and for the end of support of that line. A
# failed run (GitHub emails the repository owner) means Electron needs
# updating; see docs/RELEASING.md. Run it by hand to check sooner.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Newer Electron release or end of support
        run: node .github/scripts/check-electron-release.mjs
